name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-bookworm
        env:
          POSTGRES_DB: androidapm_test
          POSTGRES_USER: androidapm
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U androidapm -d androidapm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APM_ENVIRONMENT: test
      APM_DATABASE_URL: postgresql+asyncpg://androidapm:test-only-password@localhost:5432/androidapm_test
      APM_TEST_POSTGRES_URL: postgresql+asyncpg://androidapm:test-only-password@localhost:5432/androidapm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Sync locked environment
        run: |
          uv sync --all-groups --frozen
          pnpm --dir web install --frozen-lockfile
      - name: Web verification
        run: |
          pnpm --dir web run lint
          pnpm --dir web run typecheck
          pnpm --dir web run test
          pnpm --dir web run build
      - name: Static verification
        run: |
          uv run ruff check .
          uv run mypy src
          uv run python scripts/verify_docs.py
      - name: Migrate PostgreSQL
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests and coverage
        run: |
          uv run pytest --cov=androidapm_server --cov-report=term --cov-fail-under=70
          uv run pytest integration_tests
      - name: Validate container assets
        run: |
          docker compose config
          docker build --tag androidapm-server:${{ github.sha }} .
